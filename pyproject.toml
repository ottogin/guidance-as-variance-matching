[project]
name = "vmg"
version = "1.0.0"
description = "Variance-matched guidance: the guidance weight of a diffusion model from calibration moments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "torch>=2.4"]

[project.optional-dependencies]
# the released pipelines behind the paper's models (exact pins: reproduce/envs/)
models = ["diffusers>=0.36", "transformers>=4.50", "accelerate", "sentencepiece", "protobuf", "pillow", "av", "imageio[ffmpeg]",
          "timm", "einops", "click", "tqdm"]
audio = ["torchaudio", "soundfile", "pyarrow"]   # AudioLDM 2; Stable Audio Open and MDM need their own envs (reproduce/envs)
figures = ["matplotlib>=3.10"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vmg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["paper", "runs", "results", ".venv", "user_study"]
markers = ["gpu: needs a CUDA device and model weights (deselected by default)"]
addopts = "-m 'not gpu'"
